name: CI

on:
  pull_request_target:
    types: [labeled]
    branches:
      - main
  
  push:
    branches:
      - main

jobs:
  trigger:
    name: Trigger and comment
    if: github.event_name == 'push' || 
      (github.event_name == 'pull_request_target' && github.event.label.name == 'needs-build') 
    runs-on: ubuntu-latest
    # permissions:
    #   contents: read
    #   pull-requests: write # Needed to remove the label
    steps:
      - name: Checkout PR Code
        uses: actions/checkout@v5

      - name: Comment on the PR
        if: github.event_name == 'pull_request_target'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          
          COMMIT_SHA="${{ github.event.pull_request.head.sha }}"
          COMMIT_URL="${{ github.server_url }}/${{ github.repository }}/commit/$COMMIT_SHA"
          PR_NUMBER=${{ github.event.pull_request.number }}
          
          gh pr comment $PR_NUMBER --body "Snap build: [Workflow Run]($RUN_URL) | $COMMIT_URL"

  work:
    name: Work
    needs: [trigger]
    if: github.event_name == 'push' || 
       (github.event_name == 'pull_request_target' && github.event.label.name == 'needs-build')
    permissions:
      contents: read
      pull-requests: write # Needed to remove the trigger label
    strategy:
      fail-fast: false
      matrix:
        runs: [1, 2]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR Code
        uses: actions/checkout@v5
      - name: Work
        run: |
          echo "PR # ${{ github.event.pull_request.number }}"
          echo "SHA: $(git rev-parse HEAD)"
          cat README.md

  clean:
    name: Remove label
    needs: [trigger, work]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # Needed to remove the label
    steps:
      - name: Checkout PR Code
        uses: actions/checkout@v5
        
      - name: Remove 'needs-build' label
        if: github.event_name == 'pull_request_target'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}
          gh pr edit $PR_NUMBER --remove-label "needs-build"
