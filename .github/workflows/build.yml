name: CI

on:
  pull_request_target:
    types: [labeled]
    branches:
      - main
  
  push:
    branches:
      - main

jobs:
  ci_and_cleanup:
    if: github.event_name == 'push' || 
      (github.event_name == 'pull_request_target' && github.event.label.name == 'needs-build') 
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # Needed to remove the label
    steps:

      - name: Checkout PR Code
        uses: actions/checkout@v5
        # with:
          # Checkout the commit associated with the PR event
          # ref: ${{ github.event.pull_request.head.sha }}

      - name: Work
        run: |
          echo "PR # ${{ github.event.pull_request.number }}"
          echo "SHA: $(git rev-parse HEAD)"
          cat README.md

      - name: Remove 'needs-build' label
        if: github.event_name == 'pull_request'
        # Use the GitHub CLI to remove the label from the PR
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}
          gh pr edit $PR_NUMBER --remove-label "needs-build"
        env:
          # Use the default token, which has the necessary 'pull-requests: write' permission
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
