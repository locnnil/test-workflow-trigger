name: Label Triggered CI

on:
  # Trigger when a label is added to a PR
  pull_request:
    types: [labeled]

jobs:
  ci_and_cleanup:
    # Run only when the specific label is applied
    if: github.event.label.name == 'needs-build'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # Needed to remove the label
    steps:

      - name: Checkout PR Code
        uses: actions/checkout@v5
        with:
          # Checkout the commit associated with the PR event
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Work
        run: |
          echo "PR # ${{ github.event.pull_request.number }}"
          echo "SHA: $(git rev-parse HEAD)"
          cat README.md

      - name: Remove 'needs-build' label
        # Use the GitHub CLI to remove the label from the PR
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}
          gh pr edit $PR_NUMBER --remove-label "needs-build"
        env:
          # Use the default token, which has the necessary 'pull-requests: write' permission
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
